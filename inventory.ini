# Real cluster topology (verified against live Proxmox/Kubernetes state, 2026-11-01):
# - Proxmox is a 2-node cluster: 192.168.1.80 ("proxmox") and 192.168.1.81 ("node1")
#   - prox-k8ctrl (9000), prox-node2 (9002), prox-node3 (9004) live on 192.168.1.80
#   - prox-node1 (9001) lives on 192.168.1.81 - a separate physical host, easy to miss
# - k8s_nodes has 3 members, not 1 - vars.yml must define all 3 (see k8s_workers list)

[proxmox_server]
192.168.1.80
192.168.1.81

[k8s_master]
192.168.1.90 # prox-k8ctrl

[k8s_nodes]
192.168.1.91 # prox-node1 - lives on the 192.168.1.81 hypervisor, not .80
192.168.1.92 # prox-node2
192.168.1.93 # prox-node3 - Bluetooth dongle (USB passthrough) + vGPU passthrough; see apps/home-assistant README in k8gitops

# Subset of k8s_nodes that needs playbooks/main/configure_node3_bluetooth.yml run once
# after first boot - currently just prox-node3, which has the USB Bluetooth dongle
# passed through from the hypervisor (see vars.yml's k8s_workers BT-Dongle mapping).
[bluetooth_dongle_host]
192.168.1.93

[instances:children]
proxmox_server
k8s_master
k8s_nodes

[proxmox_server:vars]
ansible_user='root'
ansible_ssh_private_key_file='~/.ssh/id_rsa'
ansible_ssh_common_args='-o ServerAliveInterval=5 -o StrictHostKeyChecking=no'

[k8s_master:vars]
ansible_user='debian'
ansible_ssh_private_key_file='~/.ssh/id_rsa'
ansible_ssh_common_args='-o ServerAliveInterval=5 -o StrictHostKeyChecking=no'

[k8s_nodes:vars]
ansible_user='debian'
ansible_ssh_private_key_file='~/.ssh/id_rsa'
ansible_ssh_common_args='-o ServerAliveInterval=5 -o StrictHostKeyChecking=no'
