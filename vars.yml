###############################################################################################
#                                      -General Options-                                      #
###############################################################################################
# These parameters are required.                                                              #
###############################################################################################

# qcow2 image to use for your Virtual Machines:
qcow2_image: 'https://cdimage.debian.org/cdimage/openstack/current-10/debian-10-openstack-amd64.qcow2'

# Location to use for storing the qcow2 image. Be sure to end the absolute path with a '/'.
qcow2_download_location: '/tmp/'

# Resource Pool for your virtual machines.
k8s_resource_pool: 'Kubernetes'

# Path to the SSH Public Key on your Proxmox Server.
k8s_ssh_key: '/root/.ssh/id_rsa.pub'

# CNI: Flannel is what's actually running on the live cluster (verified: kube-flannel
# namespace, kube-flannel-ds-* DaemonSet on every node since near cluster creation,
# /etc/cni/net.d/10-flannel.conflist on the nodes). These used to be misleadingly named
# calico_cidr/calico_policy_url (a leftover from the upstream template this repo was forked
# from, which originally supported Calico) despite calico_policy_url's *value* already
# pointing at Flannel's own manifest - renamed for clarity, value unchanged.
#
# A later, separate branch (feature/cilium) tried migrating to Cilium via Helm, but that
# migration was never actually applied to the live cluster - don't resurrect it without
# first confirming with whoever runs this cluster that a CNI migration is actually wanted,
# since swapping CNI under a live cluster is highly disruptive.
flannel_cidr: "10.244.0.0"
flannel_policy_url: "https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml"

# Kubernetes version. Live cluster is on v1.31.x as of 2026-11-01.
# - kubernetes_version (no 'v' prefix) pins the kubelet/kubeadm/kubectl apt packages in
#   install_base_packages.yml and feeds kubeadm_init_version below.
# - kubernetes_apt_series (major.minor, with 'v') selects the pkgs.k8s.io apt repo path.
# Bump both together when upgrading - previously this var existed but was silently ignored
# (the apt repo was hardcoded to v1.28 while this said v1.30.0), so the two had drifted apart
# entirely before this fix.
kubernetes_version: "1.31.12"
kubernetes_apt_series: "v1.31"
kubeadm_init_version: "v{{ kubernetes_version }}"

# VM IDs, hostnames, resources, network, storage - verified against live `qm config` output
# on both Proxmox hosts on 2026-11-01. This is a 2-node Proxmox cluster, not a single
# hypervisor - `host` below must match an entry in inventory.ini's [proxmox_server] group,
# and deploy_qcow2_vms.yml delegates each VM's creation to its own `host`.
#
# Defaults shared by every node unless overridden in that node's own dict below.
k8s_vm_defaults:
  cpu: '4'
  mem: '16384'
  size: '60G'
  gw: '192.168.1.1'
  sn: '/22'
  ns: '192.168.2.14 192.168.2.15' # Technitium - see k8gitops CLAUDE.md "Node-level DNS is not GitOps-managed"
  sd: 'dadgar.se'
  bridge: 'vmbr0'

k8s_master_node:
  id: '9000'
  hn: 'prox-k8ctrl'
  host: '192.168.1.80'
  ip: '192.168.1.90'
  stg: 'proxmox_data'

k8s_workers:
  - id: '9001'
    hn: 'prox-node1'
    host: '192.168.1.81'   # the OTHER Proxmox hypervisor in the cluster - easy to miss, qm list on .80 won't show this VM at all
    ip: '192.168.1.91'
    stg: 'node1_data'      # different physical host, different local storage pool name than the others
    stg_format: 'raw'
    extra_qm_args: "--hostpci0 0000:01:00.0,pcie=1,romfile=AMD.VegaM.128.rom --numa 0 --vga none"
    # Raw PCI passthrough (AMD Vega Mobile GPU) specific to this physical host's hardware -
    # the PCI bus address will need re-verifying (`lspci` on 192.168.1.81) if that machine's
    # hardware ever changes, since raw PCI addresses aren't portable like the mapping= style
    # resource mappings used on the other host below.

  - id: '9002'
    hn: 'prox-node2'
    host: '192.168.1.80'
    ip: '192.168.1.92'
    stg: 'proxmox_data'
    extra_qm_args: "--cpu host,hidden=1,flags=+pcid --hostpci0 mapping=vGPU-Pool,x-vga=1 --vga std --args \"-cpu 'host'\""
    # vGPU-Pool is a cluster-level Proxmox resource mapping (Datacenter -> Resource Mappings) -
    # must already exist before this playbook is run against a fresh Proxmox install.

  - id: '9004'
    hn: 'prox-node3'
    host: '192.168.1.80'
    ip: '192.168.1.93'
    stg: 'proxmox_data'
    firewall: true
    extra_qm_args: "--cpu host,hidden=1,flags=+pcid --hostpci0 mapping=vGPU-Pool,x-vga=1 --usb0 mapping=BT-Dongle --vga none --args \"-cpu 'host'\""
    # BT-Dongle (USB passthrough, CSR8510 A10 Bluetooth dongle) is required for the
    # home-assistant Plejd bridge - see k8gitops apps/home-assistant/README.md. That same
    # README also documents the one-time host-level steps this repo still doesn't automate
    # (bluez install, USB autosuspend udev rule) - see playbooks/main/configure_node3_bluetooth.yml.
    #
    # This VM's cloud-init drive was intentionally detached on 2026-11-01 (it was the only one
    # of the 4 still carrying a live ide2 cloudinit medium, and its stored ipconfig0 had drifted
    # to a wrong, conflicting IP - see k8gitops session notes). Do not re-attach an ide2
    # cloudinit drive to this VM without first confirming this file's ip/gw/ns are correct,
    # since Proxmox's stored config silently overwrites the guest's live netplan on the next
    # cloud-init run otherwise.


###############################################################################################
#                      -NFS mounts (Synology, shared across all nodes)-                        #
###############################################################################################
# Every node mounts these from the Synology NAS at the OS level (fstab), independent of
# Kubernetes/Flux entirely. Required by many k8gitops apps that use hostPath volumes under
# /media/* (sonarr, radarr, sab, prowlarr, firefox, unpackerr, airplay, technitium,
# home-assistant). Losing this on a rebuilt node silently breaks every one of those apps -
# they'll start, but write into an empty local directory instead of the real share.
nfs_server: '192.168.1.3'
nfs_mounts:
  - share: '/volume1/download'
    path: '/media/download'
  - share: '/volume1/movies'
    path: '/media/movies'
  - share: '/volume1/TVshows'
    path: '/media/tvshows'
nfs_mount_opts: 'nouser,rsize=8192,wsize=8192,atime,auto,rw,dev,exec,suid,_netdev'


###############################################################################################
#                                     -Dashboard Options-                                     #
###############################################################################################
# These parameters are only required if you intend to deploy the Kubernetes Dashboard to your #
# cluster. If you wish to bind the Dashboard service to a Load Balanced IP Address, then      #
# uncomment and provide the values below. If you wish to deploy the Dashboard like normal,    #
# and use `kubectl-proxy` or `kubectl port-forward` to expose it, leave them commented out.   #
#                                                                                             #
# NOTE: the Dashboard does not appear to be in active use - nothing in k8gitops references    #
# it, and deploy_dashboard.yml's own IP/hostname values below had drifted to meaningless      #
# placeholders. Treat this whole section as unverified; fill in real values before running    #
# playbooks/optional/deploy_dashboard.yml, don't assume these are current.                    #
###############################################################################################

k8s_dashboard_url: 'https://raw.githubusercontent.com/kubernetes/dashboard/v2.0.3/aio/deploy/recommended.yaml'
k8s_user_name: 'fd'
dashboard_load_balancer_address_pool: 'layer2'
dashboard_load_balancer_ip: ''  # was the unreachable placeholder '10.10.10.100' - pick a real 192.168.2.x IP outside MetalLB's auto-assign range if you actually deploy this
dashboard_hostname: ''          # was 'adguard.dadgar.se' - leftover from an unrelated app, never valid for this purpose
