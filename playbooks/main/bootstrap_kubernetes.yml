---
- hosts: k8s_master
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Reset the cluster
      become: yes
      shell: kubeadm reset -f
      ignore_errors: yes
      register: reset_cluster
      changed_when: "'[reset] Successfully stopped the kube-apiserver' in reset_cluster.stdout"

    - name: Initializing Kubernetes on the master.
      become: yes
      shell: |
        kubeadm init \
          --kubernetes-version="{{ kubernetes_version }}" \
          --pod-network-cidr={{ cilium_cidr }}/16

    - name: Creating a kube directory on the master for the config files.
      become: yes
      file:
        path: $HOME/.kube
        state: directory

    - name: Copying the kube config to the kube directory.
      become: yes
      shell: cp /etc/kubernetes/admin.conf $HOME/.kube/config

    - name: Install required packages for Cilium CLI.
      become: yes
      apt:
        name:
          - curl
          - tar
          - coreutils
        state: present

    - name: Download Helm command line tool
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        return_content: true
      register: helm_installer

    - name: Install Helm
      ansible.builtin.command:
        cmd: bash
        stdin: "{{ helm_installer.content }}"
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version | default('') }}"        
  
    # - name: Download Cilium from GitHub
    #   ansible.builtin.uri:
    #     url: "https://github.com/cilium/cilium/archive/refs/heads/main.tar.gz"
    #     method: GET
    #     dest: "/tmp/main.tar.gz"
    #     return_content: no
    #   register: download_result
    
    # - name: Extract cilium
    #   ansible.builtin.unarchive:
    #     src: /tmp/main.tar.gz
    #     dest: /tmp
    #     remote_src: yes
    #   when: download_result is succeeded

    - name: Install Cilium with Helm
      become: yes
      shell: |
        helm repo add cilium https://helm.cilium.io/
        helm repo update
        helm install cilium cilium/cilium --namespace kube-system
      args:
        executable: /bin/bash        

    - name: Retreiving the kube config.
      become: yes
      shell: cat ~/.kube/config
      register: k8s_config

    - name: Create a remote ~/.kube directory on master node
      become: yes
      file:
        path: ~/.kube
        state: directory

    - name: Copy the kube config to the remote ~/.kube directory.
      become: yes
      copy:
        content: "{{ k8s_config.stdout }}"
        dest: ~/.kube/config

    - name: Creating a local ~/.kube directory on your workstation.
      local_action:
        module: file
        path: ~/.kube
        state: directory

    - name: Copying ~/.kube/config to your workstation.
      local_action: copy content={{ k8s_config.stdout }} dest=~/.kube/config-proxmox

    - name: Retreiving the kubeadm join command.
      become: yes
      shell: kubeadm token create --print-join-command
      when: k8s_join_command is undefined
      register: k8s_join_command

- hosts: k8s_nodes
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Joining the nodes to the master.
      become: yes
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command']['stdout'] }} --ignore-preflight-errors=all"