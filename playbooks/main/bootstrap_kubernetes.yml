---
- hosts: k8s_master
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Initializing Kubernetes on the master.
      become: yes
      shell: |
        kubeadm init \
          --kubernetes-version="{{ kubernetes_version }}" \
          --pod-network-cidr={{ cilium_cidr }}/16

    - name: Creating a kube directory on the master for the config files.
      become: yes
      file:
        path: $HOME/.kube
        state: directory

    - name: Copying the kube config to the kube directory.
      become: yes
      shell: cp /etc/kubernetes/admin.conf $HOME/.kube/config

    - name: Install required packages for Cilium CLI.
      become: yes
      apt:
        name:
          - curl
          - tar
          - sha256sum
        state: present

    - name: Download Cilium CLI
      become: yes
      shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        tar xzvf cilium-linux-${CLI_ARCH}.tar.gz -C /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
      args:
        executable: /bin/bash

    - name: Install Cilium using the CLI
      become: yes
      shell: |
        cilium install --chart-directory ./install/kubernetes/cilium
      args:
        chdir: /tmp

    - name: Retreiving the kube config.
      become: yes
      shell: cat ~/.kube/config
      register: k8s_config

    - name: Creating a local ~/.kube directory on your workstation.
      local_action:
        module: file
        path: ~/.kube
        state: directory

    - name: Copying ~/.kube/config to your workstation.
      local_action: copy content={{ k8s_config.stdout }} dest=~/.kube/config

    - name: Retreiving the kubeadm join command.
      become: yes
      shell: kubeadm token create --print-join-command
      when: k8s_join_command is undefined
      register: k8s_join_command

- hosts: k8s_nodes
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Joining the nodes to the master.
      become: yes
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command']['stdout'] }} --ignore-preflight-errors=all"