---
- hosts: k8s_master
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Safety check - refuse to reset an existing cluster without explicit confirmation.
      assert:
        that:
          - confirm_destroy | default(false) | bool
        fail_msg: >-
          This playbook unconditionally runs `kubeadm reset -f` on the master, which wipes
          any existing cluster's control plane state. It is meant for bootstrapping a FRESH
          set of VMs (right after deploy_qcow2_vms.yml), not for re-running against an
          already-live cluster. Re-run with -e confirm_destroy=true only once you've
          confirmed that's actually what you want.
      run_once: true

    - name: Reset the cluster
      become: yes
      shell: kubeadm reset -f
      ignore_errors: yes
      register: reset_cluster
      changed_when: "'[reset] Successfully stopped the kube-apiserver' in reset_cluster.stdout"

    - name: Initializing Kubernetes on the master.
      become: yes
      shell: |
        kubeadm init \
          --kubernetes-version="{{ kubeadm_init_version }}" \
          --pod-network-cidr={{ flannel_cidr }}/16

    - name: Creating a kube directory on the master for the config files.
      become: yes
      file:
        path: $HOME/.kube
        state: directory

    - name: Copying the kube config to the kube directory.
      become: yes
      shell: cp /etc/kubernetes/admin.conf $HOME/.kube/config

    - name: Installing the Flannel CNI.
      become: yes
      shell: kubectl --kubeconfig=$HOME/.kube/config apply -f {{ flannel_policy_url }}
      # This is what the live cluster actually runs (verified: kube-flannel namespace,
      # kube-flannel-ds-* DaemonSet on every node). A prior version of this playbook
      # installed Cilium via Helm instead - that was never applied to the live cluster,
      # so Helm/Cilium CLI aren't needed here at all; Flannel is a plain manifest apply.

    - name: Retreiving the kube config.
      become: yes
      shell: cat ~/.kube/config
      register: k8s_config
      no_log: true # this is the full cluster-admin kubeconfig - never let it hit the log

    - name: Create a remote ~/.kube directory on master node
      become: yes
      file:
        path: ~/.kube
        state: directory

    - name: Copy the kube config to the remote ~/.kube directory.
      become: yes
      copy:
        content: "{{ k8s_config.stdout }}"
        dest: ~/.kube/config
      no_log: true

    - name: Creating a local ~/.kube directory on your workstation.
      local_action:
        module: file
        path: ~/.kube
        state: directory

    - name: Copying ~/.kube/config to your workstation.
      local_action: copy content={{ k8s_config.stdout }} dest=~/.kube/config-proxmox
      no_log: true

    - name: Retreiving the kubeadm join command.
      become: yes
      shell: kubeadm token create --print-join-command
      when: k8s_join_command is undefined
      register: k8s_join_command
      no_log: true # contains the bootstrap token - treat like a credential

- hosts: k8s_nodes
  gather_facts: true
  tasks:
    - name: Including the variables.
      include_vars:
        file: ../../vars.yml

    - name: Joining the nodes to the master.
      become: yes
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command']['stdout'] }} --ignore-preflight-errors=Swap,SystemVerification"
      no_log: true
      # Was `--ignore-preflight-errors=all`, which silently swallows every preflight check,
      # not just the ones that are actually expected to fail in this environment (swap was
      # already disabled earlier in install_base_packages.yml but kubeadm re-checks it, and
      # SystemVerification can be noisy on nested/virtualized kernels). Suppressing `all`
      # would also hide a genuinely broken join (e.g. a port conflict) with no indication.
