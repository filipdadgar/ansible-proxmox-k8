---
# SUPERSEDED - not used by the live cluster. No app in k8gitops uses an Ingress resource
# anywhere; every app is exposed via a MetalLB LoadBalancer Service + external-dns directly
# (see e.g. apps/home-assistant/README.md in k8gitops, which calls out "no ingress
# controller" as a deliberate architecture choice). Kept here only for reference/history.
- hosts: k8s_master
  gather_facts: true
  tasks:
      - name: Including the variables.
        include_vars:
            file: ../../vars.yml
            
      - name: Deploying the ingress controller.
        become: yes
        shell: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml

      - name: Configuring the ingress controller.
        become: yes
        k8s:
            definition: "{{ lookup('template', '../../files/templates/NGINX-Ingress/svc_nginx_ingress_controller.yml.j2') | from_yaml }}"
